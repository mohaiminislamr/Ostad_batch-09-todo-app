name: Build and Deploy on Office Windows PC

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/django-todo-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/django-todo-app:latest

      - name: Restart container with persistent data
        shell: powershell
        run: |
          New-Item -Path "C:\MyTodoDB" -ItemType Directory -Force | Out-Null
          docker rm -f todo-container -ErrorAction SilentlyContinue
          docker run -d --name todo-container -p 8000:8000 -v "C:\MyTodoDB:/app/data" ${{ secrets.DOCKERHUB_USERNAME }}/django-todo-app:latest